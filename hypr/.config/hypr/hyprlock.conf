# hyprlock — fingerprint-first lock screen (replaces swaylock)
# ref: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        retry_delay = 250 # ms
    }
}

background {
    monitor =
    path = /home/kzhao/.config/sway/backgrounds/lock-screen.jpg
}

input-field {
    monitor =
    hide_input = false
    placeholder_text = Password (Enter to submit)
}

label {
    monitor =
    text = cmd[update:10000] date +%H:%M # update every 10 s
    position = 0, 100
    halign = center
    valign = center
}
