# hyprlock — fingerprint-first lock screen
# ref: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock

general {
    hide_cursor = false
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        retry_delay = 250 # ms
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/kzhao/.config/sway/backgrounds/lock-screen.jpg
    blur_passes = 2
    brightness = 0.8 # dim photo so text pops
}

# CLOCK — big thin digits
label {
    monitor =
    text = cmd[update:10000] date +%H:%M
    font_size = 110
    color = rgba(ffffffe0)
    font_family = Noto Sans CJK HK Light
    position = 0, 160
    halign = center
    valign = center
}

# DATE — small caps
label {
    monitor =
    text = cmd[update:60000] date +%-d %B, %A | tr a-z A-Z
    font_size = 17
    color = rgba(ffffff90)
    font_family = Noto Sans CJK HK
    position = 0, 60
    halign = center
    valign = center
}

# INPUT — quiet pill under the clock
input-field {
    monitor =
    size = 300, 46
    outline_thickness = 2
    rounding = -1 # full pill

    inner_color = rgba(ffffff20)
    outer_color = rgba(ffffff66)
    check_color = rgba(ffffffcc)
    fail_color = rgba(ffb4a0cc)

    font_color = rgba(ffffffcc)
    dots_size = 0.28
    dots_spacing = 0.3
    fade_on_empty = false
    placeholder_text = Enter password
    font_family = Noto Sans CJK HK

    position = 0, -60
    halign = center
    valign = center
}

# USER — bottom, barely there
label {
    monitor =
    text = $USER
    font_size = 14
    color = rgba(ffffff55)
    font_family = Noto Sans CJK HK
    position = 0, -40
    halign = center
    valign = bottom
}
