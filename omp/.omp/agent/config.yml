symbolPreset: nerd
composer:
  shape: band
  tokenRate: false
theme:
  dark: obsidian
  light: light
setupVersion: 2
modelRoles:
  slow: gx10/default:max
  default: gx10/default
  web: web/searxng
compaction:
  enabled: true
tools:
  approvalMode: write
  approval:
    read: allow
bash:
  patterns:
    - match: git push *
      approval: prompt
    - match: rm *
      approval: prompt
    - match: git reset *
      approval: prompt
    - match: git commit *
      approval: prompt
secrets:
  enabled: true
hideThinkingBlock: true
proseOnlyThinking: false
defaultThinkingLevel: auto
statusLine:
  separator: ascii
  preset: full
  contextLine: annotated
  sessionAccent: true
  transparent: false
  compactThinkingLevel: true
retry:
  fallbackChains:
    web:
      - web/parallel
      - web/perplexity
      - google-gemini-cli/gemini-2.5-flash
      - google-antigravity/gemini-2.5-flash
      - google/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - openai-codex/gpt-6-luna
      - openai-codex/gpt-5.6-luna
      - openai-codex/gpt-5.6
      - openai-codex/gpt-5.5
      - openai/gpt-6-luna
      - openai/gpt-5.6-luna
      - xai/grok-4.5
      - xai-oauth/grok-4.5
      - web/zai
      - web/exa
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/synthetic
      - web/ollama
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
images:
  autoResize: false
display:
  pinnedAgents: collapsed
personality: default